<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h2>Ticket System</h2>
        </div>
        <ul class="nav-links">
            <li><a href="#dashboard" class="nav-link active" data-page="dashboard">
                <span class="nav-icon">&#9632;</span> Dashboard
            </a></li>
            <li><a href="#tickets" class="nav-link" data-page="tickets">
                <span class="nav-icon">&#9998;</span> Ticketlar
            </a></li>
            <li class="admin-only"><a href="#users" class="nav-link" data-page="users">
                <span class="nav-icon">&#9679;</span> Kullanıcılar
            </a></li>
            <li class="admin-only"><a href="#firms" class="nav-link" data-page="firms">
                <span class="nav-icon">&#9632;</span> Firmalar
            </a></li>
            <li class="agent-only"><a href="#tags" class="nav-link" data-page="tags">
                <span class="nav-icon">&#9830;</span> Etiketler
            </a></li>
        </ul>
        <div class="sidebar-footer">
            <div id="currentUser" class="user-info"></div>
            <button id="btnLogout" class="btn-logout">Çıkış Yap</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="mainContent">
        <div id="pageContent"></div>
    </main>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div id="modalContent" class="modal-content"></div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/js/app.js"></script>
</body>
</html>
