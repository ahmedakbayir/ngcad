<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System - Giriş</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-card h1 {
            text-align: center;
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #1d4ed8; }
        .btn-login:disabled { background: #93c5fd; cursor: not-allowed; }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .default-info {
            margin-top: 24px;
            padding: 12px;
            background: #f0f9ff;
            border-radius: 8px;
            font-size: 12px;
            color: #1e40af;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Ticket System</h1>
        <p class="subtitle">Destek taleplerini yönetin</p>

        <div id="error" class="error-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="mail">E-posta</label>
                <input type="email" id="mail" placeholder="ornek@firma.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Giriş Yap</button>
        </form>

        <div class="default-info">
            Varsayılan giriş: <strong>admin@admin.com</strong> / <strong>admin123</strong>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errorEl = document.getElementById('error');
            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Giriş yapılıyor...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mail: document.getElementById('mail').value,
                        password: document.getElementById('password').value
                    })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.message || 'Giriş başarısız');
                }

                window.location.href = '/app.html';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Giriş Yap';
            }
        });

        // If already logged in, redirect
        fetch('/api/auth/me').then(r => {
            if (r.ok) window.location.href = '/app.html';
        });
    </script>
</body>
</html>
